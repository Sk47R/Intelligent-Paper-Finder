[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper_explorer"
version = "0.1.0"
description = "Intelligent Research Paper Finder: crawl, embed, search, and summarize academic papers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sujan Kapali"}]
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "numpy>=1.26",
    "sentence-transformers>=2.6",
    "scikit-learn>=1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_explorer"]
